# ==================================
# Filebeat — Collector for NGINX
# ==================================

filebeat.inputs:
  - type: log
    id: nginx-access
    enabled: true
    paths:
      - /var/log/nginx/access.log
    fields:
      source_type: nginx
      log_type: access
    fields_under_root: true

  - type: log
    id: nginx-error
    enabled: true
    paths:
      - /var/log/nginx/error.log
    fields:
      source_type: nginx
      log_type: error
    fields_under_root: true

# The output goes directly to the SIEM's Kafka repository.
# Logstash consumes this thread (not Filebeat).
output.kafka:
  hosts: ["<IP_DO_SIEM>:9094"]
  topic: "logs-nginx-default"
  codec.json:
    pretty: false
  required_acks: 1 # Confirmation from the partition leader
  compression: gzip # Reduces network traffic.
  max_message_bytes: 1000000

processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  # Timestamp de latência Filebeat (nanosegundos)
  - script:
      lang: javascript
      source: >
        function process(event) {
          event.Put("bench.t_filebeat_ns", new Date().getTime() * 1000000);
        }

# Logging - Filebeat
logging.level: warning
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 5
