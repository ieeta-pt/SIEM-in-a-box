#=================================
#   O.S. -> Windows Events Logs
#=================================
#
#

input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics            => ["logs-windows-security-default"]
    group_id          => "logstash-windows-consumer"
    codec             => json
    auto_offset_reset => "earliest"
    consumer_threads  => 2
  }
}

filter {
  # Winlogbeat already sends structured JSON; the processing is more about enrichment.

  # Mapping Windows Event IDs to readable descriptions
  if [winlog][event_id] {
    mutate {
      add_field => { "event.dataset" => "windows.security" }
    }

    # Logon events
    if [winlog][event_id] == 4624 {
      mutate {
        add_field => {
          "event.action"   => "logon-success"
          "event.category" => "authentication"
          "event.type"     => "start"
          "event.outcome"  => "success"
          "log.level"      => "info"
        }
      }
    }

    # Failed logon
    else if [winlog][event_id] == 4625 {
      mutate {
        add_field => {
          "event.action"   => "logon-failed"
          "event.category" => "authentication"
          "event.type"     => "start"
          "event.outcome"  => "failure"
          "log.level"      => "warn"
        }
      }
    }

    # Account lockout
    else if [winlog][event_id] == 4740 {
      mutate {
        add_field => {
          "event.action"   => "account-locked"
          "event.category" => "iam"
          "event.type"     => "user"
          "event.outcome"  => "failure"
          "log.level"      => "error"
        }
      }
    }

    # Privilege escalation
    else if [winlog][event_id] == 4672 {
      mutate {
        add_field => {
          "event.action"   => "privilege-assigned"
          "event.category" => "iam"
          "event.type"     => "admin"
          "log.level"      => "warn"
        }
      }
    }

    mutate {
      add_field => {
        "event.kind" => "event"
        "observer.os.type" => "windows"
      }
      rename => {
        "[winlog][computer_name]"           => "host.name"
        "[winlog][user][name]"              => "user.name"
        "[winlog][user][domain]"            => "user.domain"
        "[winlog][event_data][IpAddress]"   => "source.ip"
        "[winlog][event_data][WorkstationName]" => "source.domain"
      }
    }
  }

  # ── Bench latency instrumentation ────────────────────────────────────────
  ruby {
    code => "
      begin
        t_logstash = (Time.now.to_f * 1_000_000_000).to_i
        event.set('[bench][t_logstash_ns]', t_logstash)
        t_produce  = event.get('[bench][t_produce_ns]')
        t_filebeat = event.get('[bench][t_filebeat_ns]')
        t_produce  = t_produce.to_i  if t_produce
        t_filebeat = t_filebeat.to_i if t_filebeat
        if t_produce && t_filebeat && t_produce > 0
          event.set('[bench][lat_edge_to_kafka]',    t_filebeat - t_produce)
          event.set('[bench][lat_kafka_to_logstash]', t_logstash - t_filebeat)
        elsif t_produce && t_produce > 0
          event.set('[bench][lat_kafka_to_logstash]', t_logstash - t_produce)
        end
      rescue Exception => e
        logger.warn('bench ruby filter error', :error => e.message)
      end
    "
  }
}

output {
  elasticsearch {
    hosts    => ["https://es01:9200"]
    index    => "logs-windows.security-default"
    action   => "create"
    user     => "${ELASTIC_USER}"
    password => "${ELASTIC_PASSWORD}"
    ssl_enabled                 => true
    ssl_certificate_authorities => ["/certs/ca/ca.crt"]
  }
}
