#=========================
#   Firewall -> Pfsense
#=========================
#
#   

input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics            => ["logs-firewall-pfsense-default"]
    group_id          => "logstash-firewall-consumer"
    codec             => json
    auto_offset_reset => "earliest"
    consumer_threads  => 1
  }
}

filter {
  # pfSense sends logs via syslog in filterlog format.
  grok {
    match => {
      "message" => "%{SYSLOGTIMESTAMP:pf.time} %{HOSTNAME:pf.host} filterlog\[%{NUMBER}\]: %{NUMBER:pf.rule_number},%{DATA:pf.sub_rule},%{DATA:pf.anchor},%{DATA:pf.tracker},%{DATA:pf.interface},%{DATA:pf.reason},%{DATA:pf.action},%{DATA:pf.direction},%{NUMBER:pf.ip_version},%{GREEDYDATA:pf.payload}"
    }
    tag_on_failure => ["_pfsense_grok_failure"]
  }

  if "_pfsense_grok_failure" not in [tags] {
    date {
      match  => ["pf.time", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
      target => "@timestamp"
    }

    mutate {
      rename => {
        "pf.action"    => "event.action"
        "pf.interface" => "observer.ingress.interface.name"
        "pf.host"      => "observer.hostname"
      }
      add_field => {
        "event.kind"     => "event"
        "event.category" => "network"
        "event.type"     => "connection"
        "event.dataset"  => "pfsense.firewall"
        "observer.type"  => "firewall"
      }
    }

    # Severity classification by type of action
    if [event.action] == "block" {
      mutate { add_field => { "log.level" => "warn" } }
    } else {
      mutate { add_field => { "log.level" => "info" } }
    }
  }

  # ── Bench latency instrumentation ────────────────────────────────────────
  ruby {
    code => "
      begin
        t_logstash = (Time.now.to_f * 1_000_000_000).to_i
        event.set('[bench][t_logstash_ns]', t_logstash)
        t_produce  = event.get('[bench][t_produce_ns]')
        t_filebeat = event.get('[bench][t_filebeat_ns]')
        t_produce  = t_produce.to_i  if t_produce
        t_filebeat = t_filebeat.to_i if t_filebeat
        if t_produce && t_filebeat && t_produce > 0
          event.set('[bench][lat_edge_to_kafka]',    t_filebeat - t_produce)
          event.set('[bench][lat_kafka_to_logstash]', t_logstash - t_filebeat)
        elsif t_produce && t_produce > 0
          event.set('[bench][lat_kafka_to_logstash]', t_logstash - t_produce)
        end
      rescue Exception => e
        logger.warn('bench ruby filter error', :error => e.message)
      end
    "
  }
}

output {
  elasticsearch {
    hosts    => ["https://es01:9200"]
    index    => "logs-pfsense.firewall-default"
    action   => "create"
    user     => "${ELASTIC_USER}"
    password => "${ELASTIC_PASSWORD}"
    ssl_enabled                 => true
    ssl_certificate_authorities => ["/certs/ca/ca.crt"]
  }
}
