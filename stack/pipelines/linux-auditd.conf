#=======================
# O.S. -> Linux auditd
#========================
#
#

input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics            => ["logs-linux-audit-default"]
    group_id          => "logstash-linux-audit-consumer"
    codec             => json
    auto_offset_reset => "earliest"
    consumer_threads  => 2
  }
}

filter {
  # Support for two formats:
  #   1. Auditbeat (already standardized for ECS)
  #   2. Auditbeat raw format via Filebeat  
  
  if [event][module] == "auditd" {
    # Auditbeat already handles ECS standardization internally.
    mutate {
      add_field => {
        "event.dataset"    => "linux.audit"
        "observer.os.type" => "linux"
      }
    }

  } else {
    # Format raw: type=SYSCALL msg=audit(1234567890.123:456): ...
    grok {
      match => {
        "message" => "type=%{WORD:auditd.type} msg=audit\\(%{NUMBER:auditd.epoch}:%{NUMBER:auditd.sequence}\\): %{GREEDYDATA:auditd.raw_message}"
      }
      tag_on_failure => ["_linux_auditd_grok_failure"]
    }

    if "_linux_auditd_grok_failure" not in [tags] {
      # Parsing the key=value fields of raw_message
      kv {
        source      => "auditd.raw_message"
        field_split => " "
        value_split => "="
        target      => "auditd"
      }

      mutate {
        rename => {
          "[auditd][exe]"   => "process.executable"
          "[auditd][comm]"  => "process.name"
          "[auditd][pid]"   => "process.pid"
          "[auditd][uid]"   => "user.id"
          "[auditd][auid]"  => "user.audit.id"
          "[auditd][key]"   => "event.action"
        }
        add_field => {
          "event.kind"       => "event"
          "event.dataset"    => "linux.audit"
          "observer.os.type" => "linux"
        }
      }

      # Sort by auditd event type
      if [auditd.type] in ["EXECVE", "SYSCALL"] {
        mutate { add_field => { "event.category" => "process" } }
        mutate { add_field => { "log.level"      => "info" } }
      } else if [auditd.type] in ["USER_LOGIN", "USER_AUTH", "USER_START"] {
        mutate { add_field => { "event.category" => "authentication" } }
        mutate { add_field => { "log.level"      => "info" } }
      } else if [auditd.type] in ["USER_CMD", "CRED_REFR"] {
        mutate { add_field => { "event.category" => "process" } }
        mutate { add_field => { "log.level"      => "warn" } }
      } else if [auditd.type] in ["PATH", "FS_WATCH"] {
        mutate { add_field => { "event.category" => "file" } }
        mutate { add_field => { "log.level"      => "info" } }
      } else if [auditd.type] == "NETFILTER_PKT" {
        mutate { add_field => { "event.category" => "network" } }
        mutate { add_field => { "log.level"      => "info" } }
      }
    }
  }

  # ── Bench latency instrumentation ────────────────────────────────────────
  ruby {
    code => "
      begin
        t_logstash = (Time.now.to_f * 1_000_000_000).to_i
        event.set('[bench][t_logstash_ns]', t_logstash)
        t_produce  = event.get('[bench][t_produce_ns]')
        t_filebeat = event.get('[bench][t_filebeat_ns]')
        t_produce  = t_produce.to_i  if t_produce
        t_filebeat = t_filebeat.to_i if t_filebeat
        if t_produce && t_filebeat && t_produce > 0
          event.set('[bench][lat_edge_to_kafka]',    t_filebeat - t_produce)
          event.set('[bench][lat_kafka_to_logstash]', t_logstash - t_filebeat)
        elsif t_produce && t_produce > 0
          event.set('[bench][lat_kafka_to_logstash]', t_logstash - t_produce)
        end
      rescue Exception => e
        logger.warn('bench ruby filter error', :error => e.message)
      end
    "
  }
}

output {
  if "_linux_auditd_grok_failure" in [tags] {
    elasticsearch {
      hosts    => ["https://es01:9200"]
      index    => "logs-linux.audit-parse-errors"
      action   => "create"
      user     => "${ELASTIC_USER}"
      password => "${ELASTIC_PASSWORD}"
      ssl_enabled                 => true
      ssl_certificate_authorities => ["/certs/ca/ca.crt"]
    }
  } else {
    elasticsearch {
      hosts    => ["https://es01:9200"]
      index    => "logs-linux.audit-default"
      action   => "create"
      user     => "${ELASTIC_USER}"
      password => "${ELASTIC_PASSWORD}"
      ssl_enabled                 => true
      ssl_certificate_authorities => ["/certs/ca/ca.crt"]
    }
  }
}
