#========================
#   O.S. -> Linux Auth
#========================
#
#

input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics            => ["logs-linux-auth-default"]
    group_id          => "logstash-linux-auth-consumer"
    codec             => json
    auto_offset_reset => "earliest"
    consumer_threads  => 1
  }
}

filter {
  grok {
    match => {
      "message" => [
        # SSH login with success
        "%{SYSLOGTIMESTAMP:auth.time} %{HOSTNAME:host.name} sshd\[%{NUMBER}\]: Accepted %{WORD:auth.method} for %{USERNAME:user.name} from %{IPORHOST:source.ip} port %{NUMBER:source.port} ssh2",
        # SSH login failed
        "%{SYSLOGTIMESTAMP:auth.time} %{HOSTNAME:host.name} sshd\[%{NUMBER}\]: Failed %{WORD:auth.method} for %{USERNAME:user.name} from %{IPORHOST:source.ip} port %{NUMBER:source.port} ssh2",
        # sudo
        "%{SYSLOGTIMESTAMP:auth.time} %{HOSTNAME:host.name} sudo: %{USERNAME:user.name} : TTY=%{DATA} ; PWD=%{DATA} ; USER=%{DATA:user.target.name} ; COMMAND=%{GREEDYDATA:process.command_line}"
      ]
    }
    tag_on_failure => ["_linux_auth_grok_failure"]
  }

  if "_linux_auth_grok_failure" not in [tags] {
    date {
      match  => ["auth.time", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
      target => "@timestamp"
      remove_field => ["auth.time"]
    }

    mutate {
      add_field => {
        "event.kind"     => "event"
        "event.category" => "authentication"
        "event.dataset"  => "linux.auth"
        "observer.os.type" => "linux"
      }
    }

    # Classify outcome based on message content.
    if [message] =~ /Accepted/ {
      mutate {
        add_field => {
          "event.type"    => "start"
          "event.outcome" => "success"
          "log.level"     => "info"
        }
      }
    } else if [message] =~ /Failed/ {
      mutate {
        add_field => {
          "event.type"    => "start"
          "event.outcome" => "failure"
          "log.level"     => "warn"
        }
      }
    } else if [message] =~ /sudo/ {
      mutate {
        add_field => {
          "event.type" => "admin"
          "log.level"  => "warn"
        }
      }
    }
  }

  # ── Bench latency instrumentation ────────────────────────────────────────
  ruby {
    code => "
      begin
        t_logstash = (Time.now.to_f * 1_000_000_000).to_i
        event.set('[bench][t_logstash_ns]', t_logstash)
        t_produce  = event.get('[bench][t_produce_ns]')
        t_filebeat = event.get('[bench][t_filebeat_ns]')
        t_produce  = t_produce.to_i  if t_produce
        t_filebeat = t_filebeat.to_i if t_filebeat
        if t_produce && t_filebeat && t_produce > 0
          event.set('[bench][lat_edge_to_kafka]',    t_filebeat - t_produce)
          event.set('[bench][lat_kafka_to_logstash]', t_logstash - t_filebeat)
        elsif t_produce && t_produce > 0
          event.set('[bench][lat_kafka_to_logstash]', t_logstash - t_produce)
        end
      rescue Exception => e
        logger.warn('bench ruby filter error', :error => e.message)
      end
    "
  }
}

output {
  elasticsearch {
    hosts    => ["https://es01:9200"]
    index    => "logs-linux.auth-default"
    action   => "create"
    user     => "${ELASTIC_USER}"
    password => "${ELASTIC_PASSWORD}"
    ssl_enabled                 => true
    ssl_certificate_authorities => ["/certs/ca/ca.crt"]
  }
}
