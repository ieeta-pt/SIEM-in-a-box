#=======================
#   Pipeline Template
#=======================

input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics            => ["logs-FONTE-default"]      # topic especifico desta fonte
    group_id          => "logstash-FONTE-consumer"   # consumer group unico
    codec             => json
    auto_offset_reset => "earliest"
    consumer_threads  => 1
  }
}

filter {
  # Toda a logica de parsing, enriquecimento e normalizacao
  # especifica para esta fonte de dados

  grok {
    match => { "message" => "PADRAO_ESPECIFICO_DA_FONTE" }
    tag_on_failure => ["_FONTE_grok_failure"]
  }

  # Normalizacao para ECS (Elastic Common Schema)
  mutate {
    add_field => {
      "event.dataset"  => "FONTE.tipo"
      "event.kind"     => "event"
      "event.category" => "CATEGORIA"    # network, web, authentication, etc.
    }
  }
}

output {
  elasticsearch {
    hosts    => ["https://es01:9200"]
    index    => "logs-FONTE-default"    # indice especifico desta fonte
    action   => "create"
    user     => "${ELASTIC_USER}"
    password => "${ELASTIC_PASSWORD}"
    ssl_enabled                   => true
    ssl_certificate_authorities   => ["/certs/ca/ca.crt"]
  }
}
