# SIEM-in-a-Box measurement testbed (single host, CPU-pinned).
# SUT ("8-vCPU SIEM host") = CPUs 0-7. Generator and collectors (the
# "source hosts") run on CPUs 12-19 and are started per run by run.py.
name: bench

services:
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.7
    container_name: bench-es
    cpuset: "0-7"
    mem_limit: 6g
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=false
      - ES_JAVA_OPTS=-Xms3g -Xmx3g
    ulimits:
      memlock: {soft: -1, hard: -1}
    volumes: [esdata:/usr/share/elasticsearch/data]
    ports: ["127.0.0.1:9200:9200"]
    networks: [bench]
    healthcheck:
      test: ["CMD-SHELL", "curl -s localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 5s
      retries: 60

  kafka:
    image: bitnamilegacy/kafka:3.9
    container_name: bench-kafka
    profiles: [kafka]
    cpuset: "0-7"
    mem_limit: 2g
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_CFG_LOG_RETENTION_MS=3600000
      - KAFKA_CFG_LOG_SEGMENT_BYTES=104857600
      - KAFKA_HEAP_OPTS=-Xms1g -Xmx1g
    volumes: [kafkadata:/bitnami/kafka]
    networks: [bench]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      retries: 60

  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.7
    container_name: bench-logstash
    profiles: [kafka]
    cpuset: "0-7"
    mem_limit: 2g
    depends_on:
      kafka: {condition: service_healthy}
      es: {condition: service_healthy}
    environment:
      - LS_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - ./configs/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ${LS_PIPELINES_YML:-./configs/logstash/pipelines.yml}:/usr/share/logstash/config/pipelines.yml:ro
      - ${LS_PIPELINE_DIR:-./configs/logstash/pipeline}:/usr/share/logstash/pipeline:ro
    ports: ["127.0.0.1:9600:9600"]
    networks: [bench]

  # Full-stack cost cell only (campaign 3): Kibana idles beside the ingestion
  # containers on the SUT CPUs so that its footprint is sampled. Elasticsearch
  # security is disabled in this testbed, so Fleet Server and the detection
  # rules are not deployed here.
  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.7
    container_name: bench-kibana
    profiles: [cost]
    cpuset: "0-7"
    mem_limit: 2g
    depends_on:
      es: {condition: service_healthy}
    environment:
      - ELASTICSEARCH_HOSTS=http://es:9200
      - SERVER_HOST=0.0.0.0
      - TELEMETRY_ENABLED=false
    ports: ["127.0.0.1:5601:5601"]
    networks: [bench]

volumes:
  esdata:
  kafkadata:

networks:
  bench:
    name: bench
