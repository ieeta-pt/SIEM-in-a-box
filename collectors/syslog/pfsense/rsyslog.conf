# ===========================================
# rsyslog — Receiver for pfSense
# ===========================================
#
# Requeriment: rsyslog  omkafka module

# Installing the Kafka module for rsyslog
# apt-get install rsyslog-kafka (Ubuntu/Debian)
# dnf install rsyslog-kafka (RHEL / Fedora)

# Loading necessary modules
module(load="imudp")       # Receiving syslog via UDP
module(load="imtcp")       # Receiving syslog via TCP
module(load="omkafka")     # Send to Kafka

# Listeners syslog
input(type="imudp" port="514")
input(type="imtcp" port="514")

#Rule: Filter only pfSense logs (filterlog)
# and forward to Kafka
if $programname == "filterlog" then {
    action(
        type="omkafka"
        broker=["<IP_DO_SIEM>:9094"]
        topic="logs-firewall-pfsense-default"
        confParam=[
            "socket.keepalive.enable=true",
            "message.max.bytes=1000000"
        ]
        # Encapsulates the syslog message in JSON
        # Compatible with the Logstash JSON codec
        template="RSYSLOG_SyslogProtocol23Format"
    )
    stop
}
