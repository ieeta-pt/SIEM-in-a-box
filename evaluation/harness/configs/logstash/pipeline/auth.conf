# Push-Ingest parsing for the auth (sshd) source (same work as ingest pipeline auth-parse).
input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["bench-auth"]
    group_id => "ls-auth"
    codec => json
    auto_offset_reset => "earliest"
    consumer_threads => 1
  }
}
filter {
  grok {
    match => { "message" => '%{SYSLOGTIMESTAMP:[auth][time]} %{SYSLOGHOST:[host][name]} sshd\[%{POSINT:[process][pid]}\]: Failed password for (invalid user )?%{USERNAME:[user][name]} from %{IPORHOST:[source][ip]} port %{POSINT:[source][port]} ssh2' }
    tag_on_failure => ["_grokparsefailure"]
  }
}
output {
  elasticsearch {
    hosts => ["http://es:9200"]
    index => "bench-%{[fields][run]}-auth"
    manage_template => false
    data_stream => false
    ecs_compatibility => disabled
  }
}
