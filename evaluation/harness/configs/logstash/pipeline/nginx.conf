# Push-Ingest parsing for the nginx source (same work as ingest pipeline nginx-parse).
input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["bench-nginx"]
    group_id => "ls-nginx"
    codec => json
    auto_offset_reset => "earliest"
    consumer_threads => "${LS_CONSUMER_THREADS:1}"
  }
}
filter {
  grok {
    match => { "message" => '%{IPORHOST:[source][ip]} - %{DATA:[user][name]} \[%{HTTPDATE:[nginx][time]}\] "%{WORD:[http][request][method]} %{DATA:[url][original]} HTTP/%{NUMBER:[http][version]}" %{NUMBER:[http][response][status_code]:int} %{NUMBER:[http][response][body][bytes]:int} "%{DATA:[http][request][referrer]}" "%{DATA:[user_agent][original]}"' }
    tag_on_failure => ["_grokparsefailure"]
  }
  date { match => ["[nginx][time]", "dd/MMM/yyyy:HH:mm:ss Z"] target => "@timestamp" }
  useragent { source => "[user_agent][original]" target => "[user_agent]" }
}
output {
  elasticsearch {
    hosts => ["http://es:9200"]
    index => "bench-%{[fields][run]}-nginx"
    manage_template => false
    data_stream => false
    ecs_compatibility => disabled
  }
}
