#=========================
#   Web Service - Nginx
#=========================
#
#

input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics            => ["logs-nginx-default"]
    group_id          => "logstash-nginx-consumer"
    codec             => json
    auto_offset_reset => "earliest"
    consumer_threads  => 1
  }
}

filter {
  grok {
    match => {
      "message" => [
        "%{IPORHOST:nginx.access.remote_ip} - %{DATA:nginx.access.user_name} \[%{HTTPDATE:nginx.access.time}\] \"%{WORD:nginx.access.method} %{DATA:nginx.access.url} HTTP/%{NUMBER:nginx.access.http_version}\" %{NUMBER:nginx.access.response_code} %{NUMBER:nginx.access.body_sent.bytes} \"%{DATA:nginx.access.referrer}\" \"%{DATA:nginx.access.agent}\"",
        "%{DATA:nginx.error.time} \[%{DATA:nginx.error.level}\] %{NUMBER:nginx.error.pid}#%{NUMBER:nginx.error.tid}: %{GREEDYDATA:nginx.error.message}"
      ]
    }
    tag_on_failure => ["_nginx_grok_failure"]
  }

  if "_nginx_grok_failure" not in [tags] {
    date {
      match   => ["nginx.access.time", "dd/MMM/yyyy:HH:mm:ss Z"]
      target  => "@timestamp"
      remove_field => ["nginx.access.time"]
    }

    useragent {
      source => "nginx.access.agent"
      target => "user_agent"
    }

    mutate {
      convert => {
        "nginx.access.response_code"    => "integer"
        "nginx.access.body_sent.bytes"  => "integer"
      }
      rename => {
        "nginx.access.remote_ip"        => "source.ip"
        "nginx.access.url"              => "url.original"
        "nginx.access.method"           => "http.request.method"
        "nginx.access.response_code"    => "http.response.status_code"
        "nginx.access.body_sent.bytes"  => "http.response.body.bytes"
        "nginx.access.referrer"         => "http.request.referrer"
        "nginx.access.agent"            => "user_agent.original"
      }
      add_field => {
        "event.kind"     => "event"
        "event.category" => "web"
        "event.type"     => "access"
        "event.dataset"  => "nginx.access"
      }
    }

    if [message] =~ /" [5][0-9][0-9] / {
      mutate { add_field => { "log.level" => "error" } }
    } else if [message] =~ /" [4][0-9][0-9] / {
      mutate { add_field => { "log.level" => "warn" } }
    } else {
      mutate { add_field => { "log.level" => "info" } }
    }
  }

  # ── Bench latency instrumentation ────────────────────────────────────────
  ruby {
    code => "
      begin
        t_logstash = (Time.now.to_f * 1_000_000_000).to_i
        event.set('[bench][t_logstash_ns]', t_logstash)
        t_produce  = event.get('[bench][t_produce_ns]')
        t_filebeat = event.get('[bench][t_filebeat_ns]')
        t_produce  = t_produce.to_i  if t_produce
        t_filebeat = t_filebeat.to_i if t_filebeat
        if t_produce && t_filebeat && t_produce > 0
          event.set('[bench][lat_edge_to_kafka]',    t_filebeat - t_produce)
          event.set('[bench][lat_kafka_to_logstash]', t_logstash - t_filebeat)
        elsif t_produce && t_produce > 0
          event.set('[bench][lat_kafka_to_logstash]', t_logstash - t_produce)
        end
      rescue Exception => e
        logger.warn('bench ruby filter error', :error => e.message)
      end
    "
  }
}

output {
  elasticsearch {
    hosts    => ["https://es01:9200"]
    index    => "bench-nginx-access"
    action   => "index"
    user     => "${ELASTIC_USER}"
    password => "${ELASTIC_PASSWORD}"
    ssl_enabled                 => true
    ssl_certificate_authorities => ["/certs/ca/ca.crt"]
  }
}
